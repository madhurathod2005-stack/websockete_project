<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h1>LOGIN WORKS</h1>
    <h2>Login Page</h2>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username"><br>
    <input type="password" name="password" placeholder="Password"><br>
    <button type="submit">Login</button>
</form>
{% for message in messages %}
<p>{{ message }}</p>
{% endfor %}
</body>
</html>
